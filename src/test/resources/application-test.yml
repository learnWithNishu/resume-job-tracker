spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resumetracker_test}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
  jpa:
    hibernate:
      ddl-auto: create-drop  # fresh DB for every test run
    show-sql: false  # disable SQL logs in CI to reduce noise
  ai:
    ollama:
      base-url: http://localhost:11434
      embedding:
        model: nomic-embed-text

app:
  jwt:
    secret: ${JWT_SECRET:test-secret-key-that-is-long-enough-for-hmac}
    expiration: 86400000