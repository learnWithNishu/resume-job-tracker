spring:
  datasource:
    url: jdbc:postgresql://postgres-user:5432/resumetracker
    username: postgres
    password: postgres
  data:
    redis:
      host: redis
      port: 6379
  ai:
    ollama:
      base-url: http://host.docker.internal:11434
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
  instance:
    prefer-ip-address: true
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000