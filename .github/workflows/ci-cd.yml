name: CI/CD Pipeline — User Service

# when does this workflow run
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# environment variables available to all jobs
env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/user-service
  JAVA_VERSION: '17'

jobs:

  # ─── Job 1: Test ──────────────────────────────────────────────
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    # spin up PostgreSQL for integration tests if needed
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: resumetracker_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1 — checkout your code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # fetch full history for SonarCloud blame information
          fetch-depth: 0

      # Step 2 — install Java 17 on the runner
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # Step 3 — cache Maven dependencies
      # next run skips downloading if pom.xml unchanged
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Step 4 — run tests with test application.yml
      - name: Run tests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/resumetracker_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          # disable Ollama for tests — not available on runner
          SPRING_AI_OLLAMA_BASE_URL: http://localhost:11434
        run: mvn clean test

      # Step 5 — SonarCloud analysis with coverage
      - name: SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn verify sonar:sonar \
            -DskipTests \
            -Dsonar.projectKey=codewithnishu221_user-service \
            -Dsonar.organization=codewithnishu221 \
            -Dsonar.host.url=https://sonarcloud.io

      # Step 6 — upload test results so you can see them in GitHub
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()  # upload even if tests fail
        with:
          name: test-results
          path: target/surefire-reports/

      # Step 7 — upload coverage report
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: target/site/jacoco/

  # ─── Job 2: Build and Push Docker Image ───────────────────────
  # only runs if test job passed AND only on main branch pushes
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test  # wait for test job to complete
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # login to Docker Hub using your secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # set up Docker Buildx — enables multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # extract metadata for tagging the image
      # tags image with both git SHA and "latest"
      # so you can roll back to specific commit if needed
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      # build and push in one step
      # uses cache so unchanged layers aren't rebuilt
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # cache layers from previous builds — much faster
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # post success notification to workflow summary
      - name: Write summary
        run: |
          echo "## Docker Image Published 🚀" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.DOCKER_IMAGE }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "**SHA Tag:** ${{ env.DOCKER_IMAGE }}:sha-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY